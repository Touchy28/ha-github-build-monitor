name: Build monitor CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Python syntax
        run: python -m py_compile github_build_monitor/core.py github_build_monitor/forecast.py github_build_monitor/monitor.py
      - name: Shell syntax
        run: sh -n github_build_monitor/run.sh
      - name: Validate Home Assistant app metadata
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          repo = yaml.safe_load(Path("repository.yaml").read_text())
          config = yaml.safe_load(Path("github_build_monitor/config.yaml").read_text())
          assert repo["url"] == config["url"], "Repository URL mismatch"
          assert config["slug"] == "github_build_monitor"
          assert config["homeassistant_api"] is True
          assert "docker_api" not in config
          assert all(config["schema"].get(name) is not None for name in
                     ("repositories", "github_api_token",
                      "live_activity_enabled", "live_activity_notify_service"))
          PY
      - name: Build application container
        run: docker build -t ha-github-build-monitor:ci ./github_build_monitor
      - name: Smoke test imports inside built container
        run: docker run --rm --entrypoint python ha-github-build-monitor:ci -c 'import core, forecast, monitor; print("Monitor modules import successfully")'
